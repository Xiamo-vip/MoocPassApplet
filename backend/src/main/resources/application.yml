server:
  port: ${PORT:8088}
  error:
    include-message: never
spring:
  application:
    name: moocpass
  profiles:
    default: api,worker
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: ${MOOC_DB_URL}
    username: ${MOOC_DB_USER}
    password: ${MOOC_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${MOOC_DB_POOL_SIZE:12}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
mooc:
  encryption-key: ${MOOC_ENCRYPTION_KEY}
  app-id: ${MOOC_WX_APP_ID}
  app-secret: ${MOOC_WX_APP_SECRET}
  worker-slots: ${MOOC_WORKER_SLOTS:4}
  global-slots: ${MOOC_GLOBAL_SLOTS:30}
  user-slots: ${MOOC_USER_SLOTS:2}
  lease-seconds: 90
  log-retention-days: 30
  history-retention-days: 90
  zone: Asia/Shanghai
  chaoxing-enabled: ${MOOC_CHAOXING_ENABLED:true}
  zhy-enabled: ${MOOC_ZHY_ENABLED:true}
  proxy:
    enabled: ${MOOC_PROXY_ENABLED:false}
    type: ${MOOC_PROXY_TYPE:http}
    host: ${MOOC_PROXY_HOST:}
    port: ${MOOC_PROXY_PORT:0}
    username: ${MOOC_PROXY_USERNAME:}
    password: ${MOOC_PROXY_PASSWORD:}
    apply-to-outbound: ${MOOC_PROXY_APPLY_OUTBOUND:false}

